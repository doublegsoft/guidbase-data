<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>步步爪 (Stepaw) - 欢迎回家！开启元气满满的一天 🐾</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- 萌系字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <!-- 彩屑粒子库 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #edf5f1;
      background-image: 
        radial-gradient(#cce7da 1.5px, transparent 1.5px), 
        radial-gradient(#cce7da 1.5px, #edf5f1 1.5px);
      background-size: 28px 28px;
      color: #1e293b;
    }

    /* TADA 3D 软萌微凸卡片容器 */
    .tada-card {
      background: #ffffff;
      border: 3.5px solid #e1efe7;
      border-radius: 36px;
      box-shadow: 0 16px 35px -6px rgba(45, 74, 62, 0.08);
      position: relative;
    }

    /* 3D 果冻物理按键 (薄荷绿) */
    .btn-jelly-primary {
      background: linear-gradient(180deg, #34d399 0%, #059669 100%);
      box-shadow: 0 5px 0 #047857, 0 10px 18px rgba(5, 150, 105, 0.3);
      transition: all 0.1s ease;
    }
    .btn-jelly-primary:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #047857, 0 4px 8px rgba(5, 150, 105, 0.2);
    }

    /* 快捷第三方登录小圆钮 */
    .btn-social {
      background: #f8fcfa;
      border: 2px solid #d9ece2;
      box-shadow: 0 3px 0 #cde5d8;
      transition: all 0.15s ease;
    }
    .btn-social:hover {
      background: #ffffff;
      border-color: #10b981;
      transform: translateY(-2px);
    }
    .btn-social:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 软萌输入框控件 */
    .tada-input {
      background-color: #f7faf8;
      border: 2.5px solid #d9ece2;
      border-radius: 20px;
      padding: 12px 16px 12px 44px;
      font-size: 13px;
      font-weight: 800;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
      width: 100%;
    }
    .tada-input:focus {
      background-color: #ffffff;
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }

    /* 柴犬晃晃动效 */
    @keyframes petWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg) scale(1.04); }
      75% { transform: rotate(8deg) scale(1.04); }
    }
    .animate-wiggle {
      animation: petWiggle 3.5s ease-in-out infinite;
      transform-origin: bottom center;
    }

    /* 对话气泡微浮动 */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .animate-float {
      animation: floatSlow 2.5s ease-in-out infinite;
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

  <!-- 登录居中卡片 -->
  <div class="tada-card max-w-md w-full p-8 md:p-10 relative overflow-visible">

    <!-- 顶部挂载桌宠头像与问候气泡 (随交互状态改变) -->
    <div class="absolute -top-16 left-1/2 -translate-x-1/2 flex flex-col items-center">
      
      <!-- 动态小柴气泡 -->
      <div id="petBubble" class="animate-float mb-2 bg-white border-2 border-amber-300 text-amber-900 text-xs font-black px-4 py-1.5 rounded-full shadow-md whitespace-nowrap">
        汪！你今天来得真早呀！✨
      </div>

      <!-- 交互小柴表情 (输入密码时会自动蒙眼 🙈) -->
      <div id="petAvatar" class="w-20 h-20 rounded-3xl bg-amber-100 border-3 border-amber-300 flex items-center justify-center text-4xl shadow-lg shadow-amber-900/10 cursor-pointer animate-wiggle select-none" onclick="petBark()">
        🐶
      </div>
    </div>

    <!-- 标题与副标题 -->
    <div class="text-center mt-8 mb-6">
      <div class="inline-flex items-center gap-2 mb-1">
        <h1 class="text-2xl font-black text-slate-800 tracking-tight">步步爪</h1>
        <span class="text-xs bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-full font-black">
          v2.8
        </span>
      </div>
      <p class="text-xs font-bold text-slate-400">大目标轻轻拆，从容推进今天的小确幸 🐾</p>
    </div>

    <!-- 登录模式切换 Tab -->
    <div class="flex p-1.5 bg-[#eaf4ee] border-2 border-[#d6ebe0] rounded-2xl mb-6 text-xs font-black">
      <button type="button" id="tabPwd" onclick="switchTab('pwd')" class="flex-1 py-2 rounded-xl bg-white text-emerald-800 shadow-sm transition">
        账号密码登录
      </button>
      <button type="button" id="tabOtp" onclick="switchTab('otp')" class="flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition">
        免密验证码
      </button>
    </div>

    <!-- 登录表单 -->
    <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
      
      <!-- 账号输入 -->
      <div>
        <label class="block text-xs font-black text-slate-700 mb-1.5">电子邮箱 / 手机号</label>
        <div class="relative">
          <i class="fa-regular fa-envelope absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="text" id="usernameInput" required placeholder="creator@orderly.app" class="tada-input" onfocus="onAccountFocus()" onblur="onInputBlur()">
        </div>
      </div>

      <!-- 密码 / 验证码输入 -->
      <div id="pwdField">
        <div class="flex items-center justify-between mb-1.5">
          <label class="text-xs font-black text-slate-700">账户密码</label>
          <a href="#" class="text-xs font-black text-emerald-600 hover:underline">忘记密码？</a>
        </div>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-4 top-3.5 text-slate-400 text-sm"></i>
          <input type="password" id="passwordInput" placeholder="输入密码 (小柴会自动闭眼哦)" class="tada-input" onfocus="onPasswordFocus()" onblur="onInputBlur()">
        </div>
      </div>

      <!-- 验证码模式专属输入框 (默认隐藏) -->
      <div id="otpField" class="hidden">
        <label class="block text-xs font-black text-slate-700 mb-1.5">短信验证码</label>
        <div class="flex gap-2">
          <div class="relative flex-1">
            <i class="fa-solid fa-shield-halved absolute left-4 top-3.5 text-slate-400 text-sm"></i>
            <input type="text" placeholder="6 位验证码" class="tada-input" onfocus="onAccountFocus()" onblur="onInputBlur()">
          </div>
          <button type="button" class="px-4 bg-emerald-50 border-2 border-emerald-200 text-emerald-800 rounded-2xl text-xs font-black hover:bg-emerald-100 transition whitespace-nowrap">
            获取验证码
          </button>
        </div>
      </div>

      <!-- 自动记住登录状态 -->
      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center space-x-2 cursor-pointer text-xs font-extrabold text-slate-500">
          <input type="checkbox" checked class="w-4 h-4 rounded-lg accent-emerald-500 cursor-pointer">
          <span>7天内免登录 (保持小柴常驻)</span>
        </label>
      </div>

      <!-- 3D 果冻登录大按钮 -->
      <div class="pt-2">
        <button type="submit" class="w-full btn-jelly-primary text-white text-sm font-black py-3.5 rounded-2xl flex items-center justify-center space-x-2">
          <span>开始今天的微启动之旅</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </div>

    </form>

    <!-- 分隔线 -->
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t-2 border-dashed border-[#e6f1eb]"></div>
      </div>
      <div class="relative flex justify-center text-xs font-black">
        <span class="bg-white px-3 text-slate-400">快捷开启</span>
      </div>
    </div>

    <!-- 社交平台快捷登录 -->
    <div class="grid grid-cols-3 gap-3">
      <button type="button" onclick="socialLogin('微信')" class="btn-social py-2.5 rounded-2xl flex items-center justify-center text-emerald-600 text-sm">
        <i class="fa-brands fa-weixin"></i>
      </button>
      <button type="button" onclick="socialLogin('Apple')" class="btn-social py-2.5 rounded-2xl flex items-center justify-center text-slate-800 text-sm">
        <i class="fa-brands fa-apple"></i>
      </button>
      <button type="button" onclick="socialLogin('GitHub')" class="btn-social py-2.5 rounded-2xl flex items-center justify-center text-slate-700 text-sm">
        <i class="fa-brands fa-github"></i>
      </button>
    </div>

    <!-- 底部服务协议 -->
    <p class="text-center text-[11px] font-bold text-slate-400 mt-6">
      登录即代表同意 <a href="#" class="text-emerald-700 underline font-black">《如期服务条款》</a> 与 <a href="#" class="text-emerald-700 underline font-black">《自律成长公约》</a>
    </p>

  </div>

  <script>
    const petAvatar = document.getElementById('petAvatar');
    const petBubble = document.getElementById('petBubble');

    // 1. 输入框焦点与小柴眼神互动
    function onAccountFocus() {
      petAvatar.textContent = "🐶";
      petBubble.textContent = "在看你输入账号哦~ 🐾";
    }

    // 2. ⭐ 蒙眼彩蛋：输入密码时，小柴会自动捂上眼睛 (Peek-a-boo)
    function onPasswordFocus() {
      petAvatar.textContent = "🙈";
      petBubble.textContent = "保密时间！小柴不看你的密码 🤫";
    }

    function onInputBlur() {
      petAvatar.textContent = "🐶";
      petBubble.textContent = "汪！准备好开启今天的小目标了吗？✨";
    }

    // 3. 点击小柴叫声彩蛋
    function petBark() {
      triggerConfetti();
      petBubble.textContent = "嗷呜！加油加油！今天也要如期交付！🍖";
    }

    // 4. Tab 切换 (密码 vs 验证码)
    function switchTab(type) {
      const tabPwd = document.getElementById('tabPwd');
      const tabOtp = document.getElementById('tabOtp');
      const pwdField = document.getElementById('pwdField');
      const otpField = document.getElementById('otpField');

      if (type === 'pwd') {
        tabPwd.className = "flex-1 py-2 rounded-xl bg-white text-emerald-800 shadow-sm transition";
        tabOtp.className = "flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition";
        pwdField.classList.remove('hidden');
        otpField.classList.add('hidden');
      } else {
        tabOtp.className = "flex-1 py-2 rounded-xl bg-white text-emerald-800 shadow-sm transition";
        tabPwd.className = "flex-1 py-2 rounded-xl text-slate-500 hover:text-slate-800 transition";
        pwdField.classList.add('hidden');
        otpField.classList.remove('hidden');
      }
    }

    // 5. 登录表单提交处理
    function handleLogin(e) {
      e.preventDefault();
      petAvatar.textContent = "🎉";
      petBubble.textContent = "验证通过！如期系统正在开启... 🚀";
      
      // 全屏爆彩屑礼花
      triggerConfetti();

      setTimeout(() => {
        alert("登录成功！正在跳转至工作台总览...");
      }, 800);
    }

    function socialLogin(platform) {
      triggerConfetti();
      alert(`已拉起 ${platform} 快捷授权！`);
    }

    // 彩花粒子效果
    function triggerConfetti() {
      confetti({
        particleCount: 50,
        spread: 70,
        origin: { y: 0.6 },
        colors: ['#34d399', '#10b981', '#fbbf24', '#f472b6', '#60a5fa']
      });
    }
  </script>
</body>
</html>
